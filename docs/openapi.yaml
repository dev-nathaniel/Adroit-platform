    SendEmailRequest:
      type: object
      required:
        - to
      properties:
        to:
          type: array
          items:
            type: string
            format: email
          example: ["developer@example.com"]
        subject:
          type: string
          example: "Welcome to Adroit Platform"
        template:
          type: string
          description: Optional pre-compiled template name (`org_invitation`, `welcome`, `alert`)
          example: "welcome"
        data:
          type: object
          description: Template key-value data variables
          example:
            Name: "Alex"
            DashboardURL: "https://adroit.run/dashboard"
        html_body:
          type: string
          description: Custom HTML body if template is not specified
          example: "<h1>Hello!</h1>"
        plain_body:
          type: string
          description: Custom plain-text body
          example: "Hello from Adroit!"

    SendWebhookRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          example: "https://hooks.slack.com/services/T00/B00/XXXX"
        event:
          type: string
          example: "deployment.healthy"
        secret:
          type: string
          description: Shared secret for HMAC-SHA256 signature calculation in `X-Adroit-Signature`
          example: "whsec_supersecretkey"
        headers:
          type: object
          additionalProperties:
            type: string
          example:
            X-Custom-Env: "production"
        payload:
          type: object
          description: JSON serializable webhook payload
          example:
            project_id: "proj_123"
            status: "ready"

