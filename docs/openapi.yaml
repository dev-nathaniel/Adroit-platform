  # ==========================================
  # SERVICES
  # ==========================================
  /api/v1/services:
    get:
      tags:
        - Services
      summary: List Services
      description: |
        Lists services within an organization.
        Supports filtering by specific `project_id`, or `standalone=true` for unassigned workloads.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          description: Organization UUID
          schema:
            type: string
            format: uuid
        - name: project_id
          in: query
          required: false
          description: Optional project UUID filter
          schema:
            type: string
            format: uuid
        - name: standalone
          in: query
          required: false
          description: Set to true to list only standalone services (project_id is null)
          schema:
            type: boolean
      responses:
        '200':
          description: Services retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'

    post:
      tags:
        - Services
      summary: Create Service
      description: |
        Registers a new workload (web service, worker, cron, static site).
        `project_id` is optional; if omitted or null, the service is created as a standalone workload.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Service created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/services/{id}:
    get:
      tags:
        - Services
      summary: Get Service Details
      description: Returns service configuration, resource allocations, and project linkage.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponseEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Services
      summary: Update Service
      description: Updates service properties, build commands, replica counts, and resource limits.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Service updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponseEnvelope'

    delete:
      tags:
        - Services
      summary: Delete Service
      description: Deletes a service and associated environment configurations.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service deleted successfully
