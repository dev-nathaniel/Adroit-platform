openapi: 3.0.3
info:
  title: Adroit Platform API
  description: |
    Comprehensive API specification for the **Adroit Multi-Tenant Cloud Platform-as-a-Service (PaaS)**.
    
    All requests in development are routed through the central **API Gateway** on port `8080`,
    which handles cross-cutting concerns (rate limiting, request ID propagation, CORS, panic recovery)
    and reverse proxies traffic to downstream microservices:
    - **Auth Service**: `/api/v1/auth/*` (Port `8081`)
    - **User & Organization Service**: `/api/v1/users/*` (Port `8082`)

    ### Standard Response Format
    All responses use a standardized JSON envelope:
    ```json
    {
      "success": true,
      "data": { ... },
      "meta": { "page": 1, "per_page": 20, "total_items": 100, "total_pages": 5 }
    }
    ```
    Errors return:
    ```json
    {
      "success": false,
      "error": {
        "code": "INVALID_REQUEST",
        "message": "Detailed error message",
        "details": null
      }
    }
    ```
  version: 1.0.0
  contact:
    name: Adroit Engineering Team
    url: https://github.com/dev-nathaniel/Adroit-platform

servers:
  - url: http://localhost:8080
    description: API Gateway (Central Local Development Ingress)
  - url: http://localhost:8081
    description: Auth Service (Direct Microservice Port)
  - url: http://localhost:8082
    description: User & Organization Service (Direct Microservice Port)
  - url: http://localhost:8083
    description: Notification Service (Direct Microservice Port)
  - url: http://localhost:8084
    description: Project & Service Catalog (Direct Microservice Port)
  - url: http://localhost:8085
    description: Git Integration Service (Direct Microservice Port)
  - url: http://localhost:8086
    description: Build Service (Direct Microservice Port)
  - url: http://localhost:8087
    description: Orchestration & Runtime Service (Direct Microservice Port)
  - url: http://localhost:8088
    description: Ingress & DNS Service (Direct Microservice Port)

tags:
  - name: System & Gateway
    description: Gateway health, information, and status probes
  - name: Ingress & Custom Domains
    description: Edge reverse proxy dynamic routing, custom domain registration, DNS challenge validation (CNAME/TXT), and SSL/TLS lifecycle
  - name: Deployments & Orchestration
    description: Nomad job translation, rolling/canary/blue-green rollouts, allocation inspection, and instance scaling
  - name: Authentication
    description: User registration, login, credential verification, and JWT session profiles
  - name: User Profiles
    description: User account information and profile customization
  - name: Organizations & Workspaces
    description: Multi-tenant workspace management, memberships, and role assignments
  - name: Organization Invitations
    description: Team invitation lifecycle (create, preview, accept, list, revoke)
  - name: Notifications
    description: Transactional email dispatch, webhook sending, and invitation simulation
  - name: Projects
    description: Project workspaces, environments, and project-scoped resources
  - name: Services
    description: Workload lifecycle (standalone & in-project services, dynamic project relocation, specifications)
  - name: Environment Variables
    description: Secrets and environment configuration variables for services and projects
  - name: Git Integration
    description: Git provider linking, repository discovery, and webhook ingress
  - name: Build Service
    description: Build trigger lifecycle, BuildKit execution, live log streaming, and build cancellation


paths:
  # ==========================================
  # SYSTEM & GATEWAY
  # ==========================================
  /healthz:
    get:
      tags:
        - System & Gateway
      summary: Health Check
      description: Returns health status of the API Gateway and current server UTC timestamp.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseEnvelope'

  /:
    get:
      tags:
        - System & Gateway
      summary: Gateway Information
      description: Returns gateway runtime metadata, routing engine status, and version.
      responses:
        '200':
          description: Gateway operational metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayInfoResponseEnvelope'

  /api/v1/status:
    get:
      tags:
        - System & Gateway
      summary: API v1 Subsystem Status
      description: Verifies that the API v1 subsystem is active and operational.
      responses:
        '200':
          description: API v1 subsystem active status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponseEnvelope'

  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register User
      description: |
        Registers a new user account with bcrypt password hashing (cost factor 12),
        automatically creates a personal default workspace (Organization), and issues an HMAC-SHA256 JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '400':
          description: Invalid email format or password shorter than 8 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate User
      description: Authenticates user credentials and issues a signed JWT Bearer token valid for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '400':
          description: Malformed JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Current Session Profile
      description: Returns the user profile associated with the provided JWT Bearer token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseEnvelope'
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: User account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/auth/password:
    post:
      tags:
        - Authentication
      summary: Set or Change Password
      description: |
        Sets a new password for OAuth-registered accounts, or changes an existing password
        (verifying `current_password`). Enables multi-authentication via email/password alongside GitHub.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseEnvelope'
        '400':
          description: Password too weak or malformed payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: Incorrect current password or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/auth/github:
    get:
      tags:
        - Authentication
      summary: Initiate GitHub OAuth Login
      description: |
        Redirects the caller's browser directly to GitHub's OAuth authorization page.
        Generates and attaches a CSRF protection state in an `oauth_state` HTTP-only cookie.
      parameters:
        - name: state
          in: query
          required: false
          description: Optional caller-specified CSRF state string
          schema:
            type: string
      responses:
        '307':
          description: Redirects browser to GitHub OAuth authorization URL
        '501':
          description: GitHub OAuth is not configured on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
    post:
      tags:
        - Authentication
      summary: Direct GitHub OAuth Token Exchange
      description: |
        Exchanges a temporary GitHub authorization code directly for an Adroit platform JWT session token.
        Ideal for Single Page Applications (SPAs), mobile clients, and developer CLI tools.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubAuthRequest'
      responses:
        '200':
          description: Successfully authenticated via GitHub
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '400':
          description: Invalid authorization code or state mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '501':
          description: GitHub OAuth is not configured on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/auth/github/url:
    get:
      tags:
        - Authentication
      summary: Get GitHub OAuth Authorization URL
      description: Returns the GitHub OAuth authorization URL and state token as JSON without redirecting.
      parameters:
        - name: state
          in: query
          required: false
          description: Optional caller-specified CSRF state string
          schema:
            type: string
      responses:
        '200':
          description: GitHub authorization URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAuthURLResponseEnvelope'
        '501':
          description: GitHub OAuth is not configured on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/auth/github/callback:
    get:
      tags:
        - Authentication
      summary: GitHub OAuth Callback Ingress
      description: |
        Callback endpoint redirected to by GitHub upon user authorization.
        Exchanges code with GitHub, links or creates the user account, provisions a default workspace if new,
        and either redirects to the configured frontend URL with `token` query param or returns JSON.
      parameters:
        - name: code
          in: query
          required: true
          description: Temporary OAuth authorization code issued by GitHub
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: CSRF verification state token
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Error code returned by GitHub if user rejected authorization
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          description: Human-readable error description from GitHub
          schema:
            type: string
      responses:
        '200':
          description: Authentication successful (JSON response)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '307':
          description: Redirects browser to frontend dashboard with token
        '400':
          description: Invalid authorization code, OAuth error, or state mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '501':
          description: GitHub OAuth is not configured on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'


  # ==========================================
  # USER PROFILES
  # ==========================================
  /api/v1/users/profile:
    get:
      tags:
        - User Profiles
      summary: Get Caller Profile
      description: Returns the full profile of the authenticated caller.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Caller profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

    patch:
      tags:
        - User Profiles
      summary: Update Caller Profile
      description: Updates display name or avatar URL for the authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseEnvelope'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  # ==========================================
  # ORGANIZATIONS & WORKSPACES
  # ==========================================
  /api/v1/users/organizations:
    get:
      tags:
        - Organizations & Workspaces
      summary: List Organizations
      description: Lists all organization workspaces that the caller is a member of.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponseEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

    post:
      tags:
        - Organizations & Workspaces
      summary: Create Organization
      description: Creates a new multi-tenant workspace with the caller as the `owner`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
      responses:
        '201':
          description: Organization created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponseEnvelope'
        '400':
          description: Missing organization name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/users/organizations/{orgID}:
    get:
      tags:
        - Organizations & Workspaces
      summary: Get Organization Details
      description: Returns details of a specific organization including active member count and the caller's role.
      security:
        - BearerAuth: []
      parameters:
        - name: orgID
          in: path
          required: true
          description: UUID of the organization
          schema:
            type: string
            format: uuid
            example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgDetailResponseEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: Access denied (caller is not a member of this organization)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/users/organizations/{orgID}/members:
    get:
      tags:
        - Organizations & Workspaces
      summary: List Organization Members
      description: Lists all members belonging to an organization. Caller must be a member.
      security:
        - BearerAuth: []
      parameters:
        - name: orgID
          in: path
          required: true
          description: UUID of the organization
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of organization members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberListResponseEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: Caller is not a member of this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

    post:
      tags:
        - Organizations & Workspaces
      summary: Add Member Directly
      description: Directly adds an existing user to an organization with a specified role (`owner`, `admin`, `member`). Caller must be an `owner` or `admin`.
      security:
        - BearerAuth: []
      parameters:
        - name: orgID
          in: path
          required: true
          description: UUID of the organization
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberInfoResponseEnvelope'
        '400':
          description: Invalid email or role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: Insufficient permissions (requires owner or admin role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: User with email not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: User is already a member of this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  # ==========================================
  # ORGANIZATION INVITATIONS
  # ==========================================
  /api/v1/users/organizations/{orgID}/invitations:
    get:
      tags:
        - Organization Invitations
      summary: List Organization Invitations
      description: Lists pending invitations for the specified organization. Caller must be an `owner` or `admin`.
      security:
        - BearerAuth: []
      parameters:
        - name: orgID
          in: path
          required: true
          description: UUID of the organization
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of pending invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponseEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: Insufficient permissions (requires owner or admin role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

    post:
      tags:
        - Organization Invitations
      summary: Create Organization Invitation
      description: |
        Generates a cryptographically secure token and pending invitation for an email address.
        Returns the invitation object alongside the raw `token` and `invite_url` (valid for 7 days).
        Caller must be an `owner` or `admin`.
      security:
        - BearerAuth: []
      parameters:
        - name: orgID
          in: path
          required: true
          description: UUID of the organization
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponseEnvelope'
        '400':
          description: Invalid email or role (must be 'admin' or 'member')
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: User is already a member, or has an active pending invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/users/organizations/{orgID}/invitations/{inviteID}:
    delete:
      tags:
        - Organization Invitations
      summary: Revoke Organization Invitation
      description: Revokes a pending invitation before it is accepted or expired. Caller must be an `owner` or `admin`.
      security:
        - BearerAuth: []
      parameters:
        - name: orgID
          in: path
          required: true
          description: UUID of the organization
          schema:
            type: string
            format: uuid
        - name: inviteID
          in: path
          required: true
          description: UUID of the invitation
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invitation revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/users/invitations/{token}:
    get:
      tags:
        - Organization Invitations
      summary: Preview Invitation Details
      description: |
        Public endpoint allowing recipients to view invitation metadata (organization name, inviter name, role, expiration)
        before authenticating or accepting.
      parameters:
        - name: token
          in: path
          required: true
          description: 64-character hex invitation token
          schema:
            type: string
            example: "4b87ad23f2f54019f20e98c769438096"
      responses:
        '200':
          description: Invitation preview metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewResponseEnvelope'
        '404':
          description: Invitation token not found, already accepted, revoked, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/users/invitations/{token}/accept:
    post:
      tags:
        - Organization Invitations
      summary: Accept Organization Invitation
      description: |
        Accepts the invitation and adds the caller into the organization workspace with the assigned role.
        Caller must be logged in, and their registered account email must match the invitation email.
      security:
        - BearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          description: 64-character hex invitation token
          schema:
            type: string
      responses:
        '200':
          description: Invitation accepted, caller added to workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponseEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: Authenticated user email does not match invitation recipient email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: Invitation already accepted, revoked, or user already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  # ==========================================
  # NOTIFICATIONS & COMMUNICATIONS
  # ==========================================
  /api/v1/notifications/email:
    post:
      tags:
        - Notifications
      summary: Send Transactional Email
      description: |
        Dispatches a transactional email to one or more recipients. Supports either pre-compiled platform
        templates (`org_invitation`, `welcome`, `alert`) with a variables dictionary or direct HTML / plain-text bodies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        '200':
          description: Email dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDispatchedResponseEnvelope'
        '400':
          description: Missing recipients, subject, or message body/template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '500':
          description: Outbound delivery failure from configured email provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/notifications/webhook:
    post:
      tags:
        - Notifications
      summary: Dispatch Outbound Webhook
      description: |
        Sends a JSON webhook to an external URL with automated exponential backoff retries.
        If a `secret` is provided, an HMAC-SHA256 signature is automatically computed and attached
        in the `X-Adroit-Signature: sha256=<hex>` header for recipient verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendWebhookRequest'
      responses:
        '200':
          description: Webhook delivered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDispatchedResponseEnvelope'
        '400':
          description: Invalid request payload or missing URL
