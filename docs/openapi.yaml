            instructions:
              type: string
      required:
        - success
        - data

    WebhookEventsResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              provider:
                type: string
              event_type:
                type: string
              delivery_id:
                type: string
              repo_url:
                type: string
              branch:
                type: string
              commit_hash:
                type: string
              commit_message:
                type: string
              author:
                type: string
              status:
                type: string
              error_message:
                type: string
              matched_services:
                type: array
                items:
                  type: string
              triggered_builds:
                type: array
                items:
                  type: string
              created_at:
                type: string
                format: date-time
      required:
        - success
        - data

    TriggerBuildRequest:
      type: object
      properties:
        commit_hash:
          type: string
          description: Commit SHA to build (defaults to latest HEAD)
          example: 9f82ab4d12c3
        branch:
          type: string
          description: Branch to build (defaults to service's configured branch)
          example: main
        message:
          type: string
          description: Commit or trigger summary message
          example: Manual trigger via platform API
        dockerfile_path:
          type: string
          description: Custom path to Dockerfile within the repo
          example: Dockerfile
        build_args:
          type: object
          description: Key-value build-time arguments passed to BuildKit
          additionalProperties:
            type: string
          example:
            GO_VERSION: "1.24"

    Build:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        commit_hash:
          type: string
          example: a1b2c3d4e5f6
        branch:
          type: string
          example: main
        message:
          type: string
          example: Triggered via GitHub Push
        author:
          type: string
          example: developer@example.com
        status:
          type: string
          enum: [queued, building, succeeded, failed, cancelled]
          example: succeeded
        image_tag:
          type: string
          example: registry.adroit.run/acme/web:a1b2c3d4e5f6
        image_digest:
          type: string
          example: sha256:4f828a1be5b3bc778848d61ab84b5c7e1277be160e4a9eeea3452dcebf58a888
        duration_ms:
          type: integer
          example: 2450
        triggered_by:
          type: string
          example: webhook:github
        error_message:
          type: string
          example: ""
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
      required:
        - id
        - service_id
        - commit_hash
        - branch
        - status
        - triggered_by
        - created_at

    BuildResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Build'
      required:
        - success
        - data

    BuildListResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            builds:
              type: array
              items:
                $ref: '#/components/schemas/Build'
            total:
              type: integer
              example: 12
            limit:
              type: integer
              example: 20
            offset:
              type: integer
              example: 0
      required:
        - success
        - data

    BuildLogsResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            build_id:
              type: string
              format: uuid
            logs:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  build_id:
                    type: string
                    format: uuid
                  line:
                    type: string
                  stream:
                    type: string
                    example: stdout
                  timestamp:
                    type: string
                    format: date-time
            full_log:
              type: string
              example: "[+] Building with BuildKit engine\n=> [internal] load build definition from Dockerfile\n=> exporting to image\n[+] Build succeeded!"
            total_lines:
              type: integer
              example: 8
      required:
        - success
        - data

    # --- Deployment & Orchestration Schemas ---
    Deployment:
