      description: Generates a secret and auto-configures a webhook on GitHub or GitLab for this service.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook setup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSetupResponseEnvelope'

    get:
      tags:
        - Git Integrations
      summary: Get Service Webhook Info
      description: Retrieves the webhook URL and secret for manual webhook configuration.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceWebhookInfoResponseEnvelope'

  /api/v1/git/webhooks/events:
    get:
      tags:
        - Git Integrations
      summary: List Webhook Delivery Audit Log
      description: Returns recent webhook deliveries, matched services, and triggered builds.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of webhook events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventsResponseEnvelope'

  # ==========================================
  # BUILD SERVICE
  # ==========================================
  /api/v1/services/{id}/builds:
    post:
      tags:
        - Build Service
      summary: Trigger a manual build for a service
      description: Schedules a new container compilation task for a registered service using its configured repo and branch, with optional commit hash or branch overrides.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the service
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerBuildRequest'
      responses:
        '201':
          description: Build successfully queued and execution scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    get:
      tags:
        - Build Service
      summary: List build history for a service
      description: Returns a paginated list of past and active container builds for a specific service, ordered newest first.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the service
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          required: false
          description: Filter by build status (queued, building, succeeded, failed, cancelled)
          schema:
            type: string
      responses:
        '200':
          description: Paginated build history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/builds:
    post:
      tags:
        - Build Service
      summary: Trigger build directly with service ID in body
      description: Alternative endpoint to queue a container build by passing `service_id` in the JSON request body.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
              properties:
                service_id:
                  type: string
                  format: uuid
                commit_hash:
                  type: string
                branch:
                  type: string
                message:
                  type: string
                build_args:
                  type: object
                  additionalProperties:
                    type: string
                dockerfile_path:
                  type: string
      responses:
        '201':
          description: Build successfully queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/builds/{id}:
    get:
      tags:
        - Build Service
      summary: Get detailed build status and metrics
      description: Returns build status (`queued`, `building`, `succeeded`, `failed`, `cancelled`), image tag, SHA256 digest, duration, and error messages.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the build
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed build record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/builds/{id}/cancel:
    post:
      tags:
        - Build Service
      summary: Abort an active or queued build
      description: Cancels in-flight container compilation and terminates any running runner worker or Nomad batch allocation.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the build
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Build successfully cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponseEnvelope'
        '400':
          description: Build is already finished (succeeded, failed, or cancelled)
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/builds/{id}/logs:
    get:
      tags:
        - Build Service
      summary: Fetch real-time or completed build logs
      description: Streams or fetches chronologically ordered build output logs emitted during BuildKit compilation.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the build
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 1000
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Chronological build logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildLogsResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # DEPLOYMENTS & ORCHESTRATION
  # ==========================================
  /api/v1/services/{id}/deploy:
    post:
      tags:
        - Deployments & Orchestration
      summary: Trigger Service Deployment
      description: Initiates a new workload deployment on Nomad for a service (linking latest or specified build).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the service to deploy
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                build_id:
                  type: string
                  format: uuid
                  description: Optional build ID. Defaults to latest succeeded build.
                replicas:
                  type: integer
                  description: Target instance replica count. Defaults to service min_replicas.
                  example: 2
                strategy:
                  type: string
                  enum: [rolling, canary, blue-green]
                  description: Rollout update strategy. Defaults to rolling.
                  example: rolling
      responses:
        '202':
          description: Deployment accepted and scheduling initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/services/{id}/deployments:
    get:
      tags:
        - Deployments & Orchestration
      summary: List Service Deployments
      description: Returns paginated deployment history for a specific service.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the service
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of deployments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/services/{id}/scale:
    post:
      tags:
        - Deployments & Orchestration
      summary: Scale Service Replicas
      description: Dynamically scales the active replica count for a service on Nomad.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the service to scale
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - replicas
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  example: 3
      responses:
        '200':
          description: Service scaling applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaleResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/deployments/{id}:
    get:
      tags:
        - Deployments & Orchestration
      summary: Get Deployment Details
      description: Returns deployment status, active URL, allocations, and rollout audit history.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the deployment
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed deployment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentDetailResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/deployments/{id}/spec:
    get:
      tags:
        - Deployments & Orchestration
      summary: Get Nomad HCL Job Specification
      description: Returns the generated HashiCorp Nomad HCL2 job specification (.nomad.hcl).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the deployment
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rendered Nomad job specification
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deployment_id:
                        type: string
                      job_spec:
                        type: string
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/deployments/{id}/allocations:
    get:
      tags:
        - Deployments & Orchestration
      summary: List Deployment Allocations
      description: Returns Nomad client allocations associated with the deployment.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the deployment
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Allocations list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationsResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/deployments/{id}/events:
    get:
      tags:
        - Deployments & Orchestration
      summary: Get Rollout Audit Timeline
      description: Returns the chronological audit events emitted during the deployment rollout.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the deployment
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deployment timeline events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentEventsResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/deployments/{id}/promote:
    post:
      tags:
        - Deployments & Orchestration
      summary: Promote Canary Deployment
      description: Manually promotes a healthy canary allocation to complete the full replica rollout.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the canary deployment
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Canary promoted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/deployments/{id}/rollback:
    post:
      tags:
        - Deployments & Orchestration
      summary: Rollback Deployment
      description: Reverts the service to a previously verified deployment.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the deployment to roll back
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Rollback initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      rollback_to:
                        type: string
                      new_deployment_id:
                        type: string
                      status:
                        type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/deployments/{id}/cancel:
    post:
      tags:
        - Deployments & Orchestration
      summary: Cancel Deployment
      description: Aborts an active or deploying rollout and stops associated Nomad allocations.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique UUID of the deployment to cancel
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deployment cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # INGRESS & CUSTOM DOMAINS
  # ==========================================
  /api/v1/services/{id}/domains:
    post:
      tags:
        - Ingress & Custom Domains
      summary: Add Custom Domain to Service
      description: Registers a new custom domain for a service and generates DNS challenge verification instructions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                domain:
                  type: string
                  example: api.customer.com
                verification_type:
                  type: string
                  enum: [cname, txt]
                  default: cname
                is_primary:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Custom domain registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

    get:
      tags:
        - Ingress & Custom Domains
      summary: List Service Domains
      description: Returns all custom domains registered for a service.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of custom domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainListResponseEnvelope'

  /api/v1/services/{id}/sync-routes:
    post:
      tags:
        - Ingress & Custom Domains
      summary: Force Synchronize Service Ingress Routes
      description: Manually triggers Caddy dynamic reverse proxy synchronization for a service and all its verified domains.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                upstream_url:
                  type: string
                  example: 127.0.0.1:8080
      responses:
        '200':
          description: Routes synchronized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRouteSyncResponseEnvelope'

  /api/v1/domains/{id}:
    get:
      tags:
        - Ingress & Custom Domains
      summary: Get Domain Details & DNS Instructions
      description: Returns custom domain verification status, SSL issuance state, and DNS configuration instructions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Domain UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Domain details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponseEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Ingress & Custom Domains
      summary: Delete Custom Domain
      description: Removes custom domain binding and deprovisions Caddy edge reverse proxy routes.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Domain UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Domain deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/domains/{id}/verify:
    post:
      tags:
        - Ingress & Custom Domains
      summary: Verify Domain DNS Challenge
      description: Triggers immediate DNS resolution check (CNAME or TXT) against public DNS servers.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Domain UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Domain verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyDomainResponseEnvelope'
        '422':
          description: DNS verification failed (records not yet propagated or incorrect)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyDomainResponseEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/domains/{id}/sync:
    post:
      tags:
        - Ingress & Custom Domains
      summary: Synchronize Domain Route
      description: Re-synchronizes edge reverse proxy rules in Caddy for a verified domain.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Domain UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                upstream_url:
                  type: string
                  example: 10.0.0.1:8080
      responses:
        '200':
          description: Route synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressRouteResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/ingress/routes:
    get:
      tags:
        - Ingress & Custom Domains
      summary: List Edge Ingress Routes
      description: Returns all active dynamic reverse proxy routes configured on the Caddy edge proxy.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Active ingress routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressRouteListResponseEnvelope'

# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standard HMAC-SHA256 JWT issued by `/api/v1/auth/login` or `/api/v1/auth/register`.

  responses:
    BadRequestError:
      description: Bad Request - The request parameters or body are invalid or malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'

    UnauthorizedError:
      description: Unauthorized - Authentication token is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'

    ForbiddenError:
      description: Forbidden - Caller does not have sufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'

    NotFoundError:
      description: Not Found - The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'

    ConflictError:
      description: Conflict - The request could not be completed due to a conflict with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'

  schemas:
    # --- Universal Response Envelopes ---
    ErrorResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/APIError'
      required:
        - success
        - error

    APIError:
      type: object
      properties:
        code:
          type: string
          example: "INVALID_REQUEST"
        message:
          type: string
          example: "Detailed error message"
        details:
          nullable: true
          description: Optional structured context or validation field errors
      required:
        - code
        - message

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total_items:
          type: integer
          example: 45
        total_pages:
          type: integer
          example: 3
      required:
        - page
        - per_page
        - total_items
        - total_pages

    PaginationMeta:
      $ref: '#/components/schemas/Pagination'

    MessageResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
              example: "Operation completed successfully"
      required:
        - success
        - data

    # --- System Schemas ---
    HealthResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            platform:
              type: string
              example: "Adroit PaaS"
            service:
              type: string
              example: "api-gateway"
            status:
              type: string
              example: "healthy"
            timestamp:
              type: string
              format: date-time
              example: "2026-09-29T23:50:00Z"
      required:
        - success
        - data

    GatewayInfoResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            platform:
              type: string
              example: "Adroit PaaS"
            router:
              type: string
              example: "chi/v5"
            status:
              type: string
              example: "operational"
            version:
              type: string
              example: "v1.0.0"
      required:
        - success
        - data

    StatusResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            api_version:
              type: string
              example: "v1"
            status:
              type: string
              example: "active"
      required:
        - success
        - data

    # --- Auth Schemas ---
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "engineer@adroit.run"
        name:
          type: string
          example: "Jane Doe"
        password:
          type: string
          format: password
          minLength: 8
          example: "SuperSecurePass123!"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "engineer@adroit.run"
        password:
          type: string
          format: password
          example: "SuperSecurePass123!"

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Signed JWT Bearer token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
      required:
        - token
        - user

    AuthResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthResponse'
      required:
        - success
        - data

    GitHubAuthRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          example: "35c64b73b5df5b1e6005"
        state:
          type: string
          example: "csrf-state-token-1234"

    GitHubAuthURLResponse:
      type: object
      required:
        - url
        - state
      properties:
        url:
          type: string
          example: "https://github.com/login/oauth/authorize?client_id=12345&redirect_uri=...&scope=read:user+user:email&state=abc"
        state:
          type: string
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"

    GitHubAuthURLResponseEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/GitHubAuthURLResponse'

    SetPasswordRequest:
      type: object
      required:
        - new_password
      properties:
        current_password:
          type: string
          format: password
          example: "OldPassword123!"
        new_password:
          type: string
          format: password
          minLength: 8
          example: "NewSuperPassword123!"

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        email:
          type: string
          format: email
          example: "engineer@adroit.run"
        name:
          type: string
          example: "Jane Doe"
        avatar_url:
          type: string
          example: "https://assets.adroit.run/avatars/jane.png"
        github_username:
          type: string
          example: "janedoe"
        created_at:
          type: string
          format: date-time
          example: "2026-09-29T20:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-29T20:00:00Z"
      required:
        - id
        - email
        - name
        - created_at
        - updated_at

    UserResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/User'
      required:
        - success
        - data

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
