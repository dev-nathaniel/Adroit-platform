      summary: Move Service into or out of Project
      description: |
        Dynamically moves a service into a target project, moves it between projects,
        or detaches it into a standalone service (`project_id: null`).
        Cross-tenant verification ensures the target project belongs to the same organization.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveServiceRequest'
      responses:
        '200':
          description: Service relocated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponseEnvelope'
        '403':
          description: Target project belongs to a different organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/services/{id}/env:
    get:
      tags:
        - Services
        - Environment Variables
      summary: List Service Environment Variables
      description: |
        Returns environment variables explicitly configured for this service.
        Provide `?resolved=true` to view fully merged runtime variables (project-level variables inherited, with service-level variables overriding).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
        - name: resolved
          in: query
          required: false
          description: When true, returns merged project + service environment key-value pairs
          schema:
            type: boolean
      responses:
        '200':
          description: Environment variables retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVarsListResponseEnvelope'

    post:
      tags:
        - Services
        - Environment Variables
      summary: Upsert Service Environment Variables
      description: Batches and upserts service-level environment variables.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEnvVarsRequest'
      responses:
        '200':
          description: Environment variables updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVarsListResponseEnvelope'

  /api/v1/services/{id}/env/{key}:
    delete:
      tags:
        - Services
        - Environment Variables
      summary: Delete Service Environment Variable
      description: Removes a configuration key from the service.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service UUID
          schema:
            type: string
            format: uuid
        - name: key
          in: path
          required: true
          description: Environment variable key name
          schema:
            type: string
      responses:
        '200':
          description: Environment variable removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseEnvelope'

  # ==========================================
  # GIT INTEGRATION & WEBHOOKS
  # ==========================================
  /api/v1/webhooks/github:
    post:
      tags:
        - Git Webhooks
      summary: GitHub Webhook Ingress
      description: Ingests GitHub push and ping webhooks. Verifies HMAC-SHA256 signature using X-Hub-Signature-256 header. Matches registered services, creates builds, and publishes adroit.build.requested.
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
            example: push
        - name: X-Hub-Signature-256
          in: header
          required: false
          schema:
            type: string
            example: sha256=d57...
        - name: X-GitHub-Delivery
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResultEnvelope'
        '401':
          description: Invalid webhook signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/webhooks/gitlab:
    post:
      tags:
        - Git Webhooks
      summary: GitLab Webhook Ingress
      description: Ingests GitLab push and system webhooks. Verifies secret token using X-Gitlab-Token header. Matches registered services, creates builds, and emits adroit.build.requested.
      parameters:
        - name: X-Gitlab-Event
          in: header
          required: false
          schema:
            type: string
            example: Push Hook
        - name: X-Gitlab-Token
          in: header
          required: false
          schema:
            type: string
        - name: X-Gitlab-Delivery
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResultEnvelope'
        '401':
          description: Invalid secret token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /api/v1/git/providers:
    get:
      tags:
        - Git Integrations
      summary: List Connected Git Providers
      description: Returns connected GitHub and GitLab accounts for the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Connected providers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitProvidersListResponseEnvelope'

  /api/v1/git/providers/connect:
    post:
      tags:
        - Git Integrations
      summary: Connect Git Provider
      description: Connects a personal access token or OAuth credential for GitHub or GitLab.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectProviderRequest'
      responses:
        '200':
          description: Provider connected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitProviderResponseEnvelope'

  /api/v1/git/providers/{provider}:
    delete:
      tags:
        - Git Integrations
      summary: Disconnect Git Provider
      description: Unlinks a Git provider connection for the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [github, gitlab]
      responses:
        '200':
          description: Provider disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseEnvelope'

  /api/v1/git/{provider}/repos:
    get:
      tags:
        - Git Integrations
      summary: List Repositories
      description: Discovers remote repositories available from the connected Git account.
      security:
        - BearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [github, gitlab]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: List of repositories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRepositoriesResponseEnvelope'

  /api/v1/git/{provider}/repos/{owner}/{repo}/branches:
    get:
      tags:
        - Git Integrations
      summary: List Repository Branches
      description: Lists branches for a repository to simplify service setup.
      security:
        - BearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [github, gitlab]
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitBranchesResponseEnvelope'

  /api/v1/git/services/{id}/webhook:
    post:
      tags:
        - Git Integrations
