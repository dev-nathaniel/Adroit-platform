services:
  # ============================================================================
  # PostgreSQL (Metadata & Relational State)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: adroit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adroit
      POSTGRES_PASSWORD: adroit_secret
      POSTGRES_DB: adroit_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adroit -d adroit_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis (Cache, Sessions, Rate-Limiting)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: adroit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # NATS with JetStream (Event-Driven Backbone)
  # ============================================================================
  nats:
    image: nats:2.10-alpine
    container_name: adroit-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222" # NATS client port
      - "8222:8222" # NATS monitoring dashboard / health
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # Consul (Service Registry & Mesh - Dev Mode)
  # ============================================================================
  consul:
    image: hashicorp/consul:1.18
    container_name: adroit-consul
    restart: unless-stopped
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui"]
    ports:
      - "8500:8500" # UI and HTTP API
      - "8600:8600/udp" # DNS interface
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # Vault (Secrets Engine & Dynamic Credentials - Dev Mode)
  # ============================================================================
  vault:
    image: hashicorp/vault:1.16
    container_name: adroit-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    ports:
      - "8200:8200" # Vault HTTP API
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # Caddy (Edge Reverse Proxy & Dynamic Routing)
  # ============================================================================
  caddy:
    image: caddy:2.7-alpine
    container_name: adroit-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019" # Caddy dynamic JSON Admin API
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # ============================================================================
  # Nomad (Cluster Workload Orchestration - Server Dev Mode)
  # ============================================================================
  nomad:
    image: hashicorp/nomad:1.8
    container_name: adroit-nomad
    restart: unless-stopped
    command: ["agent", "-server", "-bootstrap-expect=1", "-data-dir=/nomad/data", "-bind=0.0.0.0"]
    environment:
      NOMAD_SKIP_DOCKER_IMAGE_WARN: "1"
    ports:
      - "4646:4646" # HTTP API & Web UI
      - "4647:4647" # RPC
      - "4648:4648" # Serf WAN
    volumes:
      - nomad_data:/nomad/data
    healthcheck:
      test: ["CMD", "nomad", "status"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # Mailpit (Local Email Testing & Webmail UI)
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: adroit-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Webmail UI

volumes:
  postgres_data:
  redis_data:
  nats_data:
  caddy_data:
  caddy_config:
  nomad_data:
